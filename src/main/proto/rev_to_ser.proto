syntax = "proto3";

package ai.v1;
option go_package = "./pkg/gen/ai";
option java_package = "com.example.pickstranger";

option java_multiple_files = true;

// 서비스 앱 → Reversed Proxy: 설정 관리
service RevEnvironmentConfigService {
  rpc GetEnvironment (EnvironmentRequester) returns(RevEnvironment);
  rpc UpdateEnvironment (RevEnvironment) returns (EnvironmentUpdateResponse);
}

// Reversed Proxy → 서비스 앱: 로그인 평가 결과 전달
service RiskScoreListenerService {
  rpc OnLoginEvaluated (LoginEvaluationEvent) returns (EvaluationAck);
}

message RevEnvironment {
  string backend_service_url = 1;
  int32 proxy_port = 2;
  string ai_module_grpc_url = 3;

  float risk_score_threshold = 4;
  int32 ai_response_timeout = 5;
  int32 blacklist_duration = 6;
  repeated string whitelist_ips = 7;
  string version = 8;
}

message EnvironmentRequester {
  string service_name = 1;
}

message EnvironmentUpdateResponse {
  bool success = 1;
  string msg = 2;
}

message LoginEvaluationEvent {
  string request_id = 1;
  string user_id = 2;
  string client_ip = 3;
  float risk_score = 4;
  bool blocked = 5;
  string reason = 6;
  int64 timestamp = 7;
}

message EvaluationAck {
  bool received = 1;
}